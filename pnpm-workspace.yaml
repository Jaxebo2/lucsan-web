allowBuilds:
  esbuild: set this to true or false
  sharp: set this to true or false
  webgl-fluid: set this to true or false
onlyBuiltDependencies:
  - esbuild
  - sharp

patchedDependencies:
  webgl-fluid@0.4.0: patches/webgl-fluid@0.4.0.patch

# pnpm v11 runs `pnpm install` before each script invocation.
# Setting this to "warn" prevents pre-script failure when build scripts
# are pending approval, while still surfacing the warning.
verifyDepsBeforeRun: warn
