# pnpm v11 falla `pnpm install` (ERR_PNPM_IGNORED_BUILDS) si algún paquete con
# scripts de instalación no tiene decisión explícita.
allowBuilds:
  esbuild: true      # binario nativo, el script solo lo verifica
  sharp: true        # binario nativo, el script solo lo verifica
  webgl-fluid: false # scripts de desarrollo de la propia lib (only-allow, git hooks, registry); ya viene compilada en dist
onlyBuiltDependencies:
  - esbuild
  - sharp

patchedDependencies:
  webgl-fluid@0.4.0: patches/webgl-fluid@0.4.0.patch

# pnpm v11 runs `pnpm install` before each script invocation.
# Setting this to "warn" prevents pre-script failure when build scripts
# are pending approval, while still surfacing the warning.
verifyDepsBeforeRun: warn
